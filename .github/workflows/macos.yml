name: macOS checks and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Verify macOS SDK
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $sdk_version"
          case "$sdk_version" in
            26.*) ;;
            *) echo "Expected macOS SDK 26 for the native window appearance" >&2; exit 1 ;;
          esac
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py notes "$RELEASE_TAG" > /dev/null
          node <<'JS'
          const fs = require('node:fs');
          const version = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(version)) throw new Error('Use a release tag such as v0.1.0');
          const config = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
          config.info.productVersion = version.slice(1);
          fs.writeFileSync('wails.json', JSON.stringify(config, null, 2) + '\n');
          JS
      - name: Build universal app and generate frontend bindings
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.0 build -platform darwin/universal -trimpath -ldflags "-X main.releaseRepository=$RELEASE_REPOSITORY"
      - name: Check
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          npm --prefix frontend test
          go test ./...
          go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags production ./...
      - name: Prepare Developer ID signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/prepare-macos-signing.sh
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          NOTARY_PROFILE: midwing-notary
          NOTARY_KEYCHAIN: ${{ runner.temp }}/midwing-signing.keychain-db
        run: ./scripts/package-macos.sh "$RELEASE_TAG"
      - name: Remove signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -f "$RUNNER_TEMP/midwing-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/midwing-signing.keychain-db"
          fi
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: macos-release
          path: |
            build/release/*.dmg
            build/release/*.dmg.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py notes "$RELEASE_TAG" > notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Midwing $RELEASE_TAG" --notes-file notes.md
